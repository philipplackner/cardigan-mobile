schema: spec-driven

references:
  - id: cardigan-shared-specs
    remote: https://github.com/philipplackner/cardigan-specs.git

context: |
  Cardigan is built as three products in separate repos: this mobile app
  (Android and iOS), a backend, and a web frontend.
  Product behavior shared across all three is specified in the
  cardigan-shared-specs reference. Read it before planning a change, and
  don't restate it here.
  Specs in this repo cover only what is specific to the mobile app.

rules:
  proposal:
    - List every shared-spec requirement this change implements or depends on with its spec ID and requirement name
  specs:
    - Never copy a shared requirement into this repo, but reference by spec ID and requirement name
    - Only specify behavior that differs per platform or exists only on mobile
