# Where test code lives, for the test-first OpenSpec workflow.
# Sourced by .claude/tdd/*.sh and .claude/hooks/tdd-path-guard.sh.
#
# Patterns match paths relative to the repository root, with the same rules
# in bash and in git pathspecs: `*` also matches `/`. So `*/src/test/*` covers
# the test folder of every module, and `*.test.ts` every test file at any
# depth. A pattern for a folder must end in `/*`; a top-level folder needs its
# own pattern (`src/test/*` next to `*/src/test/*`).

# Test code: tests, fakes, fixtures, test configuration. Only the test-writer
# and the adversary may write here; the implementer may not.
# KMP test source sets (commonTest, androidHostTest, androidDeviceTest, iosTest)
# and the JVM tests of the build-logic included build.
TDD_TEST_PATTERNS=(
'*/src/*Test/*'
'*/src/test/*'
)

# Files inside the test locations that a build step rewrites while the
# implementer works (for example a committed API snapshot). Left out of every
# snapshot, so rewriting them does not stop the run. Never list files that
# tests read as expected values and that the test-writer owns.
TDD_IGNORE_PATTERNS=(
)

# Extended regex. When an implementer's shell command matches it and also
# writes files (>, tee, sed -i, cp, mv, rm, ...), the hook blocks the command.
TDD_TEST_COMMAND_REGEX='src/[A-Za-z]*Test/|src/test/'
